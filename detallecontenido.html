<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REX TV — Detalle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/detail.css">
<style>
/* ═══════════════════════════════════════
   DETALLE CONTENIDO — Rediseño Full-Page
   ═══════════════════════════════════════ */
html, body { overflow-x: hidden; background: #0a0a0a; color: #fff; }

#dc-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HERO SECTION ── */
#dc-hero {
  position: relative;
  width: 100%;
  height: 70vh;
  display: flex;
  align-items: flex-end;
  padding: 60px;
  background-size: cover;
  background-position: center 20%;
  background-repeat: no-repeat;
}

#dc-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, #0a0a0a 0%, transparent 50%, rgba(0,0,0,0.4) 100%),
              linear-gradient(to right, #0a0a0a 0%, transparent 70%);
}

#dc-hero-content {
  position: relative;
  z-index: 10;
  max-width: 800px;
}

.dc-hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 84px;
  line-height: 0.9;
  margin-bottom: 24px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}

.dc-hero-meta {
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 24px;
}

.dc-match { color: #46d369; }
.dc-qual { border: 1px solid rgba(255,255,255,0.4); padding: 1px 6px; border-radius: 3px; font-size: 14px; }

.dc-hero-desc {
  font-size: 20px;
  line-height: 1.5;
  color: #ddd;
  margin-bottom: 32px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-shadow: 0 1px 10px rgba(0,0,0,0.5);
}

.dc-btns {
  display: flex;
  gap: 16px;
}

.btn-play-large {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  color: #000;
  padding: 14px 40px;
  border-radius: 4px;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: transform 0.2s, background 0.2s;
}
.btn-play-large:hover { background: #e6e6e6; transform: scale(1.05); }
.btn-play-large svg { width: 28px; height: 28px; }

.btn-back-circle {
  position: fixed;
  top: 30px;
  left: 30px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer;
  z-index: 100;
  font-size: 24px;
  transition: background 0.2s;
}
.btn-back-circle:hover { background: rgba(255,255,255,0.2); }

/* ── CONTENT BODY ── */
#dc-main {
  padding: 40px 60px;
  flex: 1;
}

.dc-grid {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 40px;
}

.dc-side-poster {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

.dc-info-section h3 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #aaa;
  border-bottom: 2px solid #e50914;
  display: inline-block;
  padding-bottom: 5px;
}

/* ── EPISODES ── */
#dc-episodes-wrap {
  margin-top: 50px;
}

.dc-eps-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.dc-season-select {
  background: #222;
  color: #fff;
  border: 1px solid #444;
  padding: 10px 20px;
  border-radius: 4px;
  font-size: 18px;
  cursor: pointer;
}

.ep-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 20px;
}

.ep-card {
  display: flex;
  gap: 15px;
  background: #1a1a1a;
  padding: 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}
.ep-card:hover { background: #2a2a2a; }

.ep-thumb-wrap {
  position: relative;
  width: 160px;
  height: 90px;
  flex-shrink: 0;
  border-radius: 4px;
  overflow: hidden;
}

.ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
.ep-play-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  font-size: 30px;
}
.ep-card:hover .ep-play-overlay { opacity: 1; }

.ep-details { flex: 1; }
.ep-title { font-weight: 700; font-size: 18px; margin-bottom: 5px; }
.ep-synopsis { font-size: 14px; color: #aaa; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ── LOADING ── */
#dc-loading-full {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

@media (max-width: 1000px) {
  .dc-grid { grid-template-columns: 1fr; }
  .dc-side-poster { display: none; }
  #dc-hero { height: 50vh; padding: 30px; }
  .dc-hero-title { font-size: 48px; }
}
</style>
</head>
<body>

<div id="dc-loading-full">
  <div class="spinner"></div>
  <p style="margin-top:20px; color:#aaa;">Cargando detalles...</p>
</div>

<button class="btn-back-circle" onclick="history.back()">←</button>

<div id="dc-container">
  <!-- HERO: Imagen principal y acciones -->
  <div id="dc-hero">
    <div id="dc-hero-content">
      <div class="dc-hero-meta">
        <span id="dc-match" class="dc-match"></span>
        <span id="dc-year"></span>
        <span id="dc-dur"></span>
        <span class="dc-qual">HD</span>
      </div>
      <h1 id="dc-title" class="dc-hero-title"></h1>
      <h2 id="dc-orig-title" style="font-size:24px; color:#aaa; margin-top:-15px; margin-bottom:20px; font-weight:400;"></h2>
      <p id="dc-desc" class="dc-hero-desc"></p>
      <div class="dc-btns">
        <button class="btn-play-large" onclick="DetailPage.play()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Reproducir
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN: Información adicional y episodios -->
  <main id="dc-main">
    <div class="dc-grid">
      <aside>
        <img id="dc-poster-side" class="dc-side-poster" src="" alt="">
      </aside>
      <section class="dc-info-section">
        <h3>Información</h3>
        <p id="dc-cast" style="font-size:18px; line-height:1.6; color:#ccc;"></p>
        <div id="dc-tags" style="display:flex; gap:10px; margin-top:20px;"></div>
      </section>
    </div>

    <!-- Episodios si es serie -->
    <div id="dc-episodes-wrap" style="display:none;">
      <div class="dc-eps-header">
        <h2 style="font-size:32px; font-family:'Bebas Neue';">Episodios</h2>
        <select id="dc-season-select" class="dc-season-select" onchange="DetailPage.changeSeason(this.value)"></select>
      </div>
      <div id="dc-eps-list" class="ep-list"></div>
    </div>

    <!-- Contenido Relacionado -->
    <div id="dc-related-wrap" style="margin-top:60px;">
      <h2 style="font-size:32px; font-family:'Bebas Neue'; margin-bottom:20px;">Más títulos similares</h2>
      <div id="dc-related-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:15px;"></div>
    </div>
  </main>
</div>

<!-- SCRIPTS -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/navigation.js"></script>

<script>
var DetailPage = (function() {
  var _item = null;
  var _seasonsMap = null;
  var _curSeason = null;

  function _el(id) { return document.getElementById(id); }

  function _getParam(name) {
    var reg = new RegExp('[?&]' + name + '=([^&#]*)', 'i');
    var res = reg.exec(window.location.search);
    return res ? res[1] : null;
  }

  function init() {
    var postId = _getParam('id');
    var type = _getParam('type') || 'movie';
    var isLive = type === 'channel' || _getParam('isLive') === 'true';
    var title = _getParam('title') ? decodeURIComponent(_getParam('title')) : '';

    if (!postId) {
      window.location.href = 'index.html';
      return;
    }

    // Datos iniciales básicos
    _item = { id: postId, postId: postId, title: title, type: type, isLive: isLive };

    // Intentar obtener metadatos completos
    Api.fetchPlayer(postId).then(function(raw) {
      if (raw) {
        var norm = Api.normalizeItem ? Api.normalizeItem(raw, type) : raw;
        // Priorizar datos válidos sobre los genéricos
        if (norm.title && norm.title !== 'Sin título') _item.title = norm.title;
        if (norm.desc) _item.desc = norm.desc;
        if (norm.poster) _item.poster = norm.poster;
        if (norm.backdrop) _item.backdrop = norm.backdrop;
        if (norm.year) _item.year = norm.year;
        if (norm.rating) _item.rating = norm.rating;
        if (norm.cast) _item.cast = norm.cast;
        if (norm.tags) _item.tags = norm.tags;
      }
      _fillUI(_item);
      _enrichWithTMDB(postId, type, _item.title);
      
      if (type === 'tvshows' || type === 'anime') {
        _loadEps();
      }
      _loadRelated(type);
      _el('dc-loading-full').style.display = 'none';
    }).catch(function(e) {
      console.error("Error loading player data:", e);
      _fillUI(_item);
      _enrichWithTMDB(postId, type, title);
      _el('dc-loading-full').style.display = 'none';
    });
  }

  function _enrichWithTMDB(postId, type, title) {
    // 1. Buscar en TMDB para completar lo que falte (sinopsis real, rating, reparto, etc)
    var mediaType = type === 'tvshows' || type === 'anime' ? 'tv' : 'movie';
    var url = TMDB_API_BASE + '/search/' + mediaType + '?api_key=' + TMDB_API_KEY + '&query=' + encodeURIComponent(title) + '&language=es-ES';
    
    Api.proxiedFetch(url)
      .then(function(r){ return r.json(); })
      .then(function(d){ 
        var candidates = d.results || [];
        if (candidates.length > 0) {
          var match = candidates[0];
          return Api.proxiedFetch(TMDB_API_BASE + '/' + mediaType + '/' + match.id + '?api_key=' + TMDB_API_KEY + '&language=es-ES&append_to_response=credits');
        }
        throw new Error("No TMDB match");
      })
      .then(function(r){ return r.json(); })
      .then(function(details){
        if (details) {
          _item.title = details.title || details.name || _item.title;
          _item.originalTitle = details.original_title || details.original_name || _item.originalTitle;
          _item.desc = details.overview || _item.desc;
          _item.rating = details.vote_average ? details.vote_average.toFixed(1) : _item.rating;
          _item.year = (details.release_date || details.first_air_date || "").slice(0, 4) || _item.year;
          _item.dur = details.runtime ? details.runtime + 'min' : (details.episode_run_time && details.episode_run_time.length ? details.episode_run_time[0] + 'min' : _item.dur);
          
          if (details.credits && details.credits.cast && Array.isArray(details.credits.cast)) {
            _item.cast = details.credits.cast.slice(0, 5).map(function(c){ return c.name; }).join(', ');
          }

          if (details.genres && Array.isArray(details.genres)) {
            _item.tags = details.genres.map(function(g){ return g.name; });
          }

          if (details.backdrop_path) _item.backdrop = TMDB_BACK + details.backdrop_path;
          if (details.poster_path) _item.poster = TMDB_IMG + details.poster_path;
          
          _fillUI(_item);
        }
      })
      .catch(function(e) {
        console.warn("Error enriqueciendo con TMDB:", e);
      });
  }

  function _fillUI(item) {
    _el('dc-title').textContent = item.title || 'Sin título';
    _el('dc-orig-title').textContent = item.originalTitle || '';
    _el('dc-desc').textContent = item.desc || 'Sin descripción disponible.';
    _el('dc-match').textContent = item.match ? item.match + '% de coincidencia' : '';
    _el('dc-year').textContent = item.year || '';
    _el('dc-dur').textContent = item.dur || '';
    _el('dc-cast').innerHTML = item.cast ? '<strong>Reparto:</strong> ' + item.cast : '';

    var bg = item.backdrop || item.poster || '';
    if (bg) _el('dc-hero').style.backgroundImage = 'linear-gradient(to top, #0a0a0a 0%, transparent 50%, rgba(0,0,0,0.4) 100%), linear-gradient(to right, #0a0a0a 0%, transparent 70%), url(' + bg + ')';

    var poster = item.poster || item.backdrop || '';
    if (poster) _el('dc-poster-side').src = poster;

    var tagsEl = _el('dc-tags');
    tagsEl.innerHTML = '';
    var tags = item.tags || [];
    for (var i = 0; i < Math.min(tags.length, 5); i++) {
      var s = document.createElement('span');
      s.className = 'dc-tag';
      s.style.cssText = 'background:rgba(255,255,255,0.1); padding:5px 12px; border-radius:4px; font-size:14px;';
      s.textContent = tags[i];
      tagsEl.appendChild(s);
    }

    document.title = (item.title || 'Detalle') + ' — REX TV';
  }

  function _loadEps() {
    Api.fetchEpisodes(_item.postId).then(function(res) {
      if (!res || !res.seasons || !res.seasons.size) return;

      _seasonsMap = res.seasons;
      var seasonNums = [];
      _seasonsMap.forEach(function(val, key) { seasonNums.push(key); });
      seasonNums.sort(function(a, b){ return a - b; });
      _curSeason = seasonNums[0];

      var sel = _el('dc-season-select');
      sel.innerHTML = seasonNums.map(function(sn) {
        return '<option value="' + sn + '">Temporada ' + sn + '</option>';
      }).join('');

      _el('dc-episodes-wrap').style.display = 'block';
      _renderEps(_curSeason);
    }).catch(function(e) {
      console.warn("Error loading episodes:", e);
    });
  }

  function _renderEps(sn) {
    var listEl = _el('dc-eps-list');
    listEl.innerHTML = '';
    var eps = _seasonsMap.get(Number(sn)) || [];

    for (var i = 0; i < eps.length; i++) {
      (function(idx) {
        var ep = eps[idx];
        var card = document.createElement('div');
        card.className = 'ep-card';
        var thumb = ep.thumbnail || ep.thumb || _item.backdrop || '';
        card.innerHTML = 
          '<div class="ep-thumb-wrap">' +
            (thumb ? '<img src="' + thumb + '" alt="">' : '<div style="background:#333; width:100%; height:100%;"></div>') +
            '<div class="ep-play-overlay">▶</div>' +
          '</div>' +
          '<div class="ep-details">' +
            '<div class="ep-title">' + (ep.number || (idx+1)) + '. ' + (ep.title || 'Episodio ' + (idx+1)) + '</div>' +
            '<div class="ep-synopsis">' + (ep.overview || ep.description || 'Sin descripción disponible.') + '</div>' +
          '</div>';
        
        card.onclick = function() {
          _playEpisode(eps, idx);
        };
        listEl.appendChild(card);
      })(i);
    }
  }

  function _loadRelated(type) {
    var postType = type === 'tvshows' ? 'tvshows' : type === 'anime' ? 'animes' : 'movies';
    Api.fetchListing(postType, 1, 12).then(function(raw) {
      var items = [];
      for (var i = 0; i < raw.length; i++) {
        var norm = Api.normalizeItem(raw[i], postType);
        if (norm.postId !== _item.postId) items.push(norm);
      }
      items = items.slice(0, 10);

      var grid = _el('dc-related-grid');
      grid.innerHTML = '';
      for (var j = 0; j < items.length; j++) {
        (function(it) {
          var div = document.createElement('div');
          div.style.cssText = 'cursor:pointer; transition:transform 0.2s;';
          div.innerHTML = 
            '<img src="' + (it.poster || '') + '" style="width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:6px; margin-bottom:8px;">' +
            '<div style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + it.title + '</div>';
          div.onclick = function() {
            window.location.href = 'detallecontenido.html?id=' + it.postId + '&type=' + it.type + '&title=' + encodeURIComponent(it.title);
          };
          grid.appendChild(div);
        })(items[j]);
      }
    }).catch(function(e){});
  }

  function play() {
    var url = 'watch.html?id=' + _item.postId + '&type=' + _item.type + '&title=' + encodeURIComponent(_item.title);
    if (_item.isLive) url += '&isLive=true';
    window.location.href = url;
  }

  function _playEpisode(eps, idx) {
    var ep = eps[idx];
    var url = 'watch.html?id=' + _item.postId + '&type=' + _item.type + '&title=' + encodeURIComponent(_item.title) + 
              '&season=' + (ep.season || 1) + '&episode=' + (ep.number || ep.episode || (idx+1));
    if (_item.isLive) url += '&isLive=true';
    window.location.href = url;
  }

  function changeSeason(val) {
    _curSeason = val;
    _renderEps(val);
  }

  return { init: init, play: play, changeSeason: changeSeason };
})();

document.addEventListener('DOMContentLoaded', DetailPage.init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REX TV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/search.css">
</head>
<body>

<!-- ══ NAV ══ -->
<nav id="nav">
  <div class="nav-logo" onclick="App.goHome()">REX</div>
  <div class="nav-links">
    <span class="nav-link active" data-section="home"    onclick="App.switchSection('home',this)">Inicio</span>
    <span class="nav-link"        data-section="movies"  onclick="App.switchSection('movies',this)">Películas</span>
    <span class="nav-link"        data-section="series"  onclick="App.switchSection('series',this)">Series</span>
    <span class="nav-link"        data-section="animes"  onclick="App.switchSection('animes',this)">Anime</span>
    <span class="nav-link"        data-section="channels" onclick="App.switchSection('channels',this)">Canales</span>
    <span class="nav-link"        data-section="football" onclick="App.switchSection('football',this)">⚽ Fútbol</span>
  </div>
  <div class="nav-right">
    <div class="nav-search-wrap">
      <span style="font-size:13px;opacity:.5">⌕</span>
      <input type="text" placeholder="Buscar..." id="nav-q"
        onfocus="Search.open()" oninput="Search.handle(this.value)">
    </div>
    <div class="nav-avatar">R</div>
  </div>
</nav>

<!-- ══ MAIN SCROLL ══ -->
<div id="main" onscroll="App.onScroll(this)">

  <!-- HERO -->
  <div id="hero">
    <div class="hero-loading" id="hero-loading">
      <div class="spinner"></div>
      <span style="color:var(--text3);font-size:13px">Cargando catálogo...</span>
    </div>
    <div class="hero-bg"></div>
    <img class="hero-backdrop" id="hero-backdrop" src="" alt=""
         style="opacity:0;transition:opacity .8s">
    <div class="hero-content">
      <div class="hero-source" id="hero-source">★ DESTACADO</div>
      <h1 class="hero-title" id="hero-title"></h1>
      <div class="hero-meta">
        <span class="hero-rating" id="hero-rating"></span>
        <div class="hero-sep" id="hs1"></div>
        <span class="hero-year"  id="hero-year"></span>
        <div class="hero-sep"></div>
        <span class="hero-genre" id="hero-genre"></span>
        <div class="hero-sep"></div>
        <span class="hero-dur"   id="hero-dur"></span>
      </div>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-btns">
        <button class="btn-play" onclick="Hero.play()">▶ Reproducir</button>
        <button class="btn-info" onclick="Hero.openDetail()">ℹ Más info</button>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </div>

  <!-- SECTION CONTAINERS -->
  <div id="rows-home"     class="rows-wrap"></div>
  <div id="rows-movies"   class="rows-wrap no-hero" style="display:none"></div>
  <div id="rows-series"   class="rows-wrap no-hero" style="display:none"></div>
  <div id="rows-animes"   class="rows-wrap no-hero" style="display:none"></div>
  <div id="rows-channels" class="rows-wrap no-hero" style="display:none"></div>
  <div id="rows-football" class="rows-wrap no-hero" style="display:none"></div>
</div>

<!-- ══ SEARCH ══ -->
<div id="search-view">
  <div class="sv-header">
    <button class="sv-back" onclick="Search.close()">←</button>
    <input class="sv-input" id="sv-input" type="text"
           placeholder="Buscar películas, series, animes..."
           oninput="Search.handle(this.value)" autofocus>
  </div>
  <div class="sv-results" id="sv-results">
    <div class="sv-empty">Escribe para buscar contenido</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ SCRIPTS ══ -->
<script src="js/config.js"></script>
<script src="js/api.js?v=20260603-hls1"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/navigation.js"></script>
<script src="js/hero.js"></script>
<script src="js/cards.js"></script>
<script src="js/search.js"></script>
<script src="js/sections.js"></script>
<script src="js/football.js"></script>
<script src="js/tv-focus.js"></script>
<script src="js/app.js"></script>
<script src="js/webos.js"></script>

<script>
  /* Stubs — detail/player not used in index anymore, everything goes to detallecontenido.html */
  window.Detail = {
    open: function(item) {
      if (!item || !item.postId) return;
      window.location.href = 'detallecontenido.html?id=' + encodeURIComponent(item.postId) + '&type=' + encodeURIComponent(item.type || 'movie') + '&title=' + encodeURIComponent(item.title || '');
    },
    close: function() {},
    outsideClick: function() {},
    play: function() {},
    openWatchPage: function() {}
  };
  window.Player = window.Player || {
    open: function(item) {
      if (!item || !item.postId) return;
      window.location.href = 'detallecontenido.html?id=' + encodeURIComponent(item.postId) + '&type=' + encodeURIComponent(item.type || 'movie') + '&title=' + encodeURIComponent(item.title || '');
    },
    close: function() {}, togglePlay: function() {}, skip: function() {}, setVol: function() {}, toggleMute: function() {}, toggleFS: function() {},
    seek: function() {}, prevEp: function() {}, nextEp: function() {}, playNextNow: function() {}, cancelAutoplay: function() {},
    openEpisode: function(series) {
      if (!series || !series.postId) return;
      window.location.href = 'detallecontenido.html?id=' + encodeURIComponent(series.postId) + '&type=' + encodeURIComponent(series.type || 'movie') + '&title=' + encodeURIComponent(series.title || '');
    }
  };
</script>
</body>
</html>
